name: Build CyberStrikeAI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许你手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v -o CyberStrikeAI cmd/main.go

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberStrikeAI-linux
        path: CyberStrikeAI
