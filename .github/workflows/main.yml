name: Build CyberStrikeAI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: |
        # 使用 ./cmd/main.go 指明路径
        go build -v -o CyberStrikeAI ./cmd/main.go
        # 验证文件是否生成
        ls -la CyberStrikeAI

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberStrikeAI-linux
        path: ./CyberStrikeAI
        if-no-files-found: error
