name: Build CyberStrikeAI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Debug list files
        run: |
          pwd
          ls -la
          ls -la cmd
          ls -la cmd/server

      - name: Compile linux‑amd64 static binary
        run: |
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=amd64
          go build -ldflags="-s -w" -o cyberstrike-ai cmd/server/main.go
          ls -lh cyberstrike-ai

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberstrike-ai-linux-amd64
          path: ./cyberstrike-ai
          if-no-files-found: error
